backfill_statistics:
  name: Backfill statistics
  description: |
    Import historical electricity consumption and cost statistics from Helen API.

    - Rebuilds statistics from start_date to today, overwriting any existing data in that range
    - Data before start_date is never touched
    - The start date is automatically clamped to the contract start date; multi-year ranges are fetched in yearly chunks
    - Select a specific contract, or leave blank to backfill all contracts
    - Note: if your fixed unit price has changed, running this will reprice the entire requested range using the current price
  fields:
    start_date:
      name: Start date
      description: First date to backfill (inclusive). Will backfill from this date to today.
      required: true
      example: "2024-01-01"
      selector:
        date:
    config_entry_id:
      name: Contract
      description: Which Helen Energy contract to backfill. If not specified, backfills all contracts.
      required: false
      selector:
        config_entry:
          integration: helen_energy
