[project]
name = "oma-helen-ha-integration"
version = "2.3.0"
description = "Home Assistant custom integration for Helen Energy electricity service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.205",
    "responses>=0.22.0",
    "oma-helen-cli==1.8.0",
    "ruff==0.15.14",
]

[tool.uv]
prerelease = "allow"

[tool.ruff]
# Defaults, pinned explicitly: the codebase is already written to an 88-column
# style, and widening the limit would unwrap code rather than tidy it.
line-length = 88
target-version = "py312"
